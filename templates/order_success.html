<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Complete | Study Store</title>
</head>

<body>

    <h1>🎉 Order Placed Successfully!</h1>

    <p>
        Thank you for your order, {{ request.user.username }}!
    </p>

    <h2>Order #{{ order.id }}</h2>

    <p>
        Total: R{{ order.total }}
    </p>

    <h3>Items:</h3>

    {% for item in order.items.all %}

        <p>
            {{ item.product.name }}
            × {{ item.quantity }}
            — R{{ item.subtotal }}
        </p>

    {% endfor %}

    <br>

    <a href="/">
        🏠 Continue Shopping
    </a>

</body>

</html>
