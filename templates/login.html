<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Study Store</title>
</head>

<body>

    <h1>🔐 Login to Study Store</h1>

    <p>Welcome back!</p>

    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username:</label>
        <br>

        <input type="text" name="username" required>

        <br><br>

        <label>Password:</label>
        <br>

        <input type="password" name="password" required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="{% url 'register' %}">
        Don't have an account? Create one
    </a>

    <br><br>

    <a href="/">
        ← Back to Store
    </a>

</body>

</html>
